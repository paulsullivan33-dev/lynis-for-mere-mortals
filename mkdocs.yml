site_name: Lynis for Mere Mortals
site_description: A security auditor that reads a Unix system and reports what it finds. Running a Lynis audit, reading its warnings and suggestions with their test IDs, understanding the hardening index without worshipping it, and tuning profiles so the report stays worth reading, with the limits stated plainly.
